name: DenemeLab OCR Only Android 16 Device QA

on:
  push:
    branches: [fix/report-ocr-coverage-root-v021]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denemelab-ocr-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr-import-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36.1
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Add Firebase config for test compilation only
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64"
          umask 077
          printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android 16 OCR and PDF imports ONLY
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.denemelab.preview.ReportImportDeviceTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Publish test results (no installable APK distributed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-OCR-Android16-Only-Results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 5
