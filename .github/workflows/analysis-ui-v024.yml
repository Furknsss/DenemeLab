name: DenemeLab Premium Analysis UI 0.24 QA

on:
  push:
    branches: [design/analysis-data-first-v024]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-ui-v024-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore Firebase configuration for Android compile
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64" || exit 1
          umask 077
          printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
      - name: Compile UI and run all Android unit tests
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Publish build and tests (not an installable release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-Analysis-UI-v024-QA
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 5
          if-no-files-found: ignore
