name: DenemeLab Android APK

on:
  push:
    branches: [main, feat/analysis-minimal-v09, fix/ocr-highres-topic-rows-v09, feat/analysis-actionable-premium-v010, feat/data-pack-logos-report-import-v011, feat/firebase-auth-cloud-backup-v012, feat/google-account-cloud-only-v013, fix/report-import-ocr-v014, fix/google-login-android16-fallback-v015, fix/report-coverage-table-v016, fix/report-ocr-multipass-coverage-v016, feat/analysis-coverage-data-v017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denemelab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore stable test APK signing certificate
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: denemelab-v013-debug-cert-1
      - name: Prepare and display signing SHA-1 / SHA-256
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Register this TEST-APK SHA-1 in Firebase Console > Project settings > Your apps:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android | grep -E 'SHA1:|SHA256:'
          echo "Test-only certificate; release builds require a private production signing key."
      - name: Save stable debug certificate privately in Actions cache
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: denemelab-v013-debug-cert-1
      - name: Configure Firebase Android app (required for v0.13)
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_B64" ]; then
            echo "::error::Add FIREBASE_ANDROID_CONFIG_B64 to repository Actions secrets before producing a Firebase-enabled APK."
            exit 1
          fi
          umask 077
          printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          path = "app/google-services.json"
          with open(path, encoding="utf-8") as handle:
              config = json.load(handle)
          project_id = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients]
          if project_id != "denemelab-yks-2026" or "com.denemelab.preview" not in packages:
              raise SystemExit("Firebase project ID or Android package does not match DenemeLab.")
          print("Firebase project/package validated without printing configuration values.")
          PY
      - name: Run deterministic domain unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Build independent test APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Validate built APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK_SHA1=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          KEY_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$APK_SHA1" ] || [ -z "$KEY_SHA1" ] || [ "$APK_SHA1" != "$KEY_SHA1" ]; then
            echo "::error::Actual APK signer differs from the registered debug keystore. Publishing blocked."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "feat/google-account-cloud-only-v013" ] &&
             [ "$APK_SHA1" != "e9825be8fc2b21d05a8b2975691c86cb70318034" ]; then
            echo "::error::APK signer is not the SHA-1 registered in DenemeLab Firebase. Publishing blocked."
            exit 1
          fi
          echo "Android APK signer matches the Firebase debug certificate (SHA-1: $APK_SHA1)."
          # Validate the packaged resource, not an AGP-version-specific intermediate path.
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources app/build/outputs/apk/debug/app-debug.apk > /tmp/denemelab-debug-resources.txt
          if ! grep -q 'string/google_app_id' /tmp/denemelab-debug-resources.txt; then
            echo "::error::Firebase google_app_id is missing from the packaged APK."
            exit 1
          fi
          if ! grep -q 'string/default_web_client_id' /tmp/denemelab-debug-resources.txt &&
             ! grep -q 'string/denemelab_google_web_client_id' /tmp/denemelab-debug-resources.txt; then
            echo "::error::Google OAuth web client ID missing from the APK."
            exit 1
          fi
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
