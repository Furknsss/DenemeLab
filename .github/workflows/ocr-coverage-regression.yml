name: DenemeLab OCR coverage regression (no APK release)

on:
  push:
    branches: [fix/report-ocr-coverage-root-v021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36.1
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore Firebase client configuration for realistic compilation
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64" || { echo "Missing Firebase config"; exit 1; }
          umask 077
          printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
      - name: Compile and run entire Android unit-test suite (including OCR)
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-OCR-Regression-Results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 5
