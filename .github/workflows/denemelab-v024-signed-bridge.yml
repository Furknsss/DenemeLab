name: DenemeLab v0.24 Existing-Signer Update APK

on:
  push:
    branches: [feat/account-onboarding-cloud-home-v019]
    paths:
      - '.github/workflows/denemelab-v024-signed-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denemelab-v024-signed-bridge
  cancel-in-progress: true

jobs:
  signed-update-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed v0.24 source
        uses: actions/checkout@v4
        with:
          ref: cce83c6dc6d6ce79635ffd9ed0a39c37e0e12966
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      # The existing signer is scoped to this historical branch's cache.
      # Never generate a fresh key for an in-place update.
      - name: Restore existing signer privately
        id: signer
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: denemelab-v013-debug-cert-1
      - name: Fail closed if cached signing key unavailable
        run: |
          test "${{ steps.signer.outputs.cache-hit }}" = "true" || {
            echo "::error::Existing Android signer cache unavailable."; exit 1;
          }
          test -s "$HOME/.android/debug.keystore"
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android |
            grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d ':[:space:]' |
            tr '[:upper:]' '[:lower:]')
          test "$FP" = "ccddeeb6f784d00fab77f98bd3ea917512fe4fe3" || {
            echo "::error::Existing signing identity changed."; exit 1;
          }

      - name: Configure Android Firebase client
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64" || {
            echo "::error::Missing Android Firebase configuration."; exit 1;
          }
          umask 077
          printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              cfg=json.load(f)
          assert cfg["project_info"]["project_id"]=="denemelab-yks-2026"
          assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.denemelab.preview" for c in cfg["client"])
          PY

      - name: Test and assemble v0.24 update
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Verify APK signature and Firebase OAuth
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          test "$APK_SHA" = "ccddeeb6f784d00fab77f98bd3ea917512fe4fe3" || {
            echo "::error::APK signer mismatched cached signer."; exit 1;
          }
          APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            python3 scripts/verify_google_oauth_signing.py \
            --apk "$APK" --firebase app/google-services.json --package com.denemelab.preview
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -E "package: name='com.denemelab.preview'.*versionCode='24'"
          sha256sum "$APK"
          unzip -t "$APK" | tail -1
      - name: Publish same-signer update APK
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-v024-SameSigner-Update-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 10
